name: ci

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always
  # Cold crates.io downloads occasionally die on transient runner network
  # errors (broken pipe mid-transfer); raise cargo's per-download retry
  # ceiling above the default 3 to absorb them.
  CARGO_NET_RETRY: "10"

jobs:
  check:
    name: Check (fmt, clippy, doc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all --check
      # Pitfall 11 after D-08: rolify-diesel's default = ["sync"] unifies
      # rolify-core/is_sync ON for every workspace-wide build, and the
      # async-only crates (rolify-sqlx, rolify-seaorm) cannot compile
      # against the sync-shaped SPI (Phase 1 D-05). Both check-job clippy
      # variants therefore lint the graph MINUS those two; each async-only
      # crate keeps its own -D warnings leg in its dedicated job.
      # The dual-mode rolify-mongodb diverges from the other side of the
      # same Pitfall: maybe-async's mode is ONE flag for the whole build
      # graph (the macro crate's own is_sync feature unifies across every
      # consumer), while the crate's cfg arms key off its local `sync`
      # feature. A default-features rolify-mongodb (async arms) cannot
      # compile inside any graph that unifies the macro into sync mode,
      # so the default variant excludes it and it keeps a dedicated
      # default clippy leg below; the is_sync variant pins its sync mode
      # explicitly via rolify-mongodb/sync so the crate stays linted in
      # BOTH modes.
      - name: cargo clippy (default)
        run: cargo clippy --workspace --all-targets --exclude rolify-sqlx --exclude rolify-seaorm --exclude rolify-mongodb -- -D warnings
      - name: cargo clippy (is_sync)
        run: cargo clippy --workspace --all-targets --features rolify-core/is_sync,rolify-mongodb/sync --exclude rolify-sqlx --exclude rolify-seaorm -- -D warnings
      # rolify-mongodb's default (async) clippy gate; the sync mode is
      # covered by the is_sync variant above through the pinned feature.
      - name: cargo clippy (rolify-mongodb default)
        run: cargo clippy -p rolify-mongodb --all-targets -- -D warnings
      # Same unification constraint for rustdoc: the sqlx and seaorm docs
      # build in their own async graphs (no rolify-diesel in the closure),
      # and rolify-mongodb joins them for the same Pitfall-11 reason (its
      # default async arms cannot build in the sync-unified default graph).
      - name: cargo doc
        run: cargo doc --workspace --no-deps --exclude rolify-sqlx --exclude rolify-seaorm --exclude rolify-mongodb
      - name: cargo doc (rolify-sqlx)
        run: cargo doc -p rolify-sqlx --no-deps --features postgres,mysql,sqlite
      - name: cargo doc (rolify-seaorm)
        run: cargo doc -p rolify-seaorm --no-deps --features postgres,mysql
      - name: cargo doc (rolify-mongodb)
        run: cargo doc -p rolify-mongodb --no-deps

  test:
    name: Test (dual-mode + in-memory suite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Mode gates per Pitfall 11: the bare workspace command cannot stay
      # green after D-08 flipped rolify-diesel's default to ["sync"] (it
      # would unify the sync flag onto the async-only members), so each
      # mode's workspace gate isolates what cannot take it:
      # - async mode: exclude rolify-diesel (the sync-default member) AND
      #   rolify-cli (its rolify-diesel dev-dependency reintroduces the
      #   same is_sync unification through the test graph; the cli suite
      #   is mode-agnostic and runs in full, diesel store leg included,
      #   in the sync gate below)
      # - sync mode: exclude rolify-sqlx and rolify-seaorm (the
      #   async-only members), with the is_sync flag pinning the mode
      # rolify-mongodb rides both gates: maybe-async's mode is global to
      # the build graph, so the sync leg pins rolify-mongodb/sync to keep
      # the crate's cfg arms aligned with the macro mode. The async leg
      # needs no pin: excluding rolify-diesel and rolify-cli leaves no
      # is_sync unifier in the graph.
      # Neither mode can silently stop being exercised (04-09, T-04-15).
      - name: cargo test (workspace async mode, exclude rolify-diesel and rolify-cli)
        run: cargo test --workspace --exclude rolify-diesel --exclude rolify-cli
      - name: cargo test (workspace sync mode, exclude rolify-sqlx and rolify-seaorm)
        run: cargo test --workspace --features rolify-core/is_sync,rolify-mongodb/sync --exclude rolify-sqlx --exclude rolify-seaorm
      - name: cargo test (rolify-test suite async)
        run: cargo test -p rolify-test --features suite
      - name: cargo test (rolify-test suite sync)
        run: cargo test -p rolify-test --features "suite is_sync"

  adapters:
    name: Adapter legs (Postgres, MySQL, SQLite)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, mysql, sqlite]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libmysqlclient-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (rolify-diesel ${{ matrix.backend }})
        run: cargo test -p rolify-diesel --no-default-features --features "sync,${{ matrix.backend }}"
        env:
          # Ensure testcontainers can pull images
          DOCKER_HOST: unix:///var/run/docker.sock
      # Mode guard (04-05 Task 1, inverted check): the sync+async feature
      # combination must FAIL compilation. Runs once, on the postgres leg
      # where libpq is installed so the failure can only be the guard.
      - name: mode guard (sync+async must fail compilation)
        if: matrix.backend == 'postgres'
        run: |
          if cargo check -p rolify-diesel --no-default-features --features "sync,async,postgres" >/dev/null 2>&1; then
            echo "GUARD-MISSING: sync+async compiled"; exit 1
          else
            echo "GUARD-OK: sync+async rejected at compile time"
          fi
      # Per-feature clippy leg (04-09): after the D-08 default flip the two
      # check-job clippy variants compile only the default sync graph, so
      # this step is what keeps the rider's cfg(all(async, engine)) library
      # surface under a -D warnings gate on every push. The mysql leg is
      # CI-authoritative (libmysqlclient present only on the runner).
      - name: cargo clippy (rolify-diesel async,bb8,${{ matrix.backend }})
        run: cargo clippy -p rolify-diesel --no-default-features --features "async,bb8,${{ matrix.backend }}" -- -D warnings

  sqlx:
    name: SQLx adapter legs (Postgres, MySQL, SQLite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # sqlx 0.9 is a pure-Rust driver set: no libmysqlclient install step
      # here (unlike the diesel/rider jobs). Postgres and MySQL run on
      # testcontainers; SQLite is the hermetic non-gate leg (D-11) and also
      # runs the drift-guard plus the migrations roundtrip in the same
      # invocation.
      - name: cargo test (rolify-sqlx postgres,suite)
        run: cargo test -p rolify-sqlx --features postgres,suite
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo test (rolify-sqlx mysql,suite)
        run: cargo test -p rolify-sqlx --features mysql,suite
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo test (rolify-sqlx sqlite,suite)
        run: cargo test -p rolify-sqlx --features sqlite,suite
      - name: cargo test (rolify-sqlx executor, postgres)
        run: cargo test -p rolify-sqlx --features postgres,suite --test executor
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo test (rolify-sqlx concurrency, postgres)
        run: cargo test -p rolify-sqlx --features postgres,suite --test concurrency
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo test (rolify-sqlx concurrency, mysql)
        run: cargo test -p rolify-sqlx --features mysql,suite --test concurrency
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      # The sqlx lib is excluded from the check-job workspace variants
      # (Pitfall 11), so this per-feature leg is its -D warnings gate.
      - name: cargo clippy (rolify-sqlx all engines)
        run: cargo clippy -p rolify-sqlx --features postgres,mysql,sqlite -- -D warnings

  seaorm:
    name: SeaORM adapter legs (Postgres, MySQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # D-17: seaorm legs are containerized, engine-additive. The crate is
      # async-only (D-05): no sync feature exists to gate. The parity suite
      # runs the full twelve modules per engine (the ADPT-05 gate).
      - name: cargo test (rolify-seaorm postgres,suite)
        run: cargo test -p rolify-seaorm --features postgres,suite
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo test (rolify-seaorm mysql,suite)
        run: cargo test -p rolify-seaorm --features mysql,suite
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo clippy (rolify-seaorm all engines)
        run: cargo clippy -p rolify-seaorm --features postgres,mysql -- -D warnings
      # D-10 phase-5 floor: 1.94 for rolify-seaorm (sea-orm 2.0.4).
      - uses: dtolnay/rust-toolchain@1.94
      - name: cargo +1.94 check (rolify-seaorm)
        run: cargo +1.94 check -p rolify-seaorm --features postgres,mysql

  mongodb:
    name: MongoDB adapter legs (async + sync)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # D-17: mongodb adapter is dual-mode (async default, sync opt-in).
      # The parity suite runs the full twelve modules in BOTH modes (D-13).
      # Async mode: default feature set (async mongodb driver).
      - name: cargo test (rolify-mongodb async,suite)
        run: cargo test -p rolify-mongodb --features suite
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      # Sync mode: full suite under core is_sync + mongodb sync (D-13).
      - name: cargo test (rolify-mongodb sync,suite)
        run: cargo test -p rolify-mongodb --features sync,rolify-core/is_sync,suite
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo clippy (rolify-mongodb async)
        run: cargo clippy -p rolify-mongodb --all-targets -- -D warnings
      - name: cargo clippy (rolify-mongodb sync)
        run: cargo clippy -p rolify-mongodb --all-targets --features sync -- -D warnings

  rider-async:
    name: Diesel-async rider legs (Postgres, MySQL, SQLite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libmysqlclient-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      # D-09: bb8 is the canonical gate pool for the full parity suites;
      # deadpool gets compile-check plus exactly one smoke round trip
      # (deadpool_smoke step), never the full suite. The mysql leg is
      # CI-authoritative: it needs libmysqlclient, installed above.
      - name: cargo test (rolify-diesel async,bb8,postgres,suite)
        run: cargo test -p rolify-diesel --no-default-features --features async,bb8,postgres,suite
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo test (rolify-diesel async,bb8,mysql,suite)
        run: cargo test -p rolify-diesel --no-default-features --features async,bb8,mysql,suite
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo test (rolify-diesel async,bb8,sqlite,suite)
        run: cargo test -p rolify-diesel --no-default-features --features async,bb8,sqlite,suite
      - name: cargo test (rolify-diesel executor_async, async,bb8,postgres)
        run: cargo test -p rolify-diesel --no-default-features --features async,bb8,postgres --test executor_async
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: cargo test (rolify-diesel deadpool smoke, async,deadpool,postgres)
        run: cargo test -p rolify-diesel --no-default-features --features async,deadpool,postgres --test deadpool_smoke
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

  msrv:
    name: MSRV floors (per-crate)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # D-21: every published floor checked on its own toolchain.
          # Legs are check-only on lib targets (the 03-06 rationale), so
          # dev-only deps (testcontainers, 1.88 floor) never gate the
          # 1.85 crates.
          - floor: "1.85"
            label: rolify-core
            args: -p rolify-core
          - floor: "1.85"
            label: rolify-cli
            args: -p rolify-cli
          - floor: "1.85"
            label: rolify-test
            args: -p rolify-test
          - floor: "1.86"
            label: rolify-diesel sync,postgres
            args: -p rolify-diesel --no-default-features --features sync,postgres
          - floor: "1.86"
            label: rolify-diesel sync,mysql
            args: -p rolify-diesel --no-default-features --features sync,mysql
          - floor: "1.86"
            label: rolify-diesel sync,sqlite
            args: -p rolify-diesel --no-default-features --features sync,sqlite
          - floor: "1.86"
            label: rolify-diesel async,bb8,postgres
            args: -p rolify-diesel --no-default-features --features async,bb8,postgres
          - floor: "1.88"
            label: rolify-mongodb async
            args: -p rolify-mongodb
          - floor: "1.88"
            label: rolify-mongodb sync
            args: -p rolify-mongodb --features sync
          - floor: "1.94"
            label: rolify-sqlx
            args: -p rolify-sqlx --features postgres,mysql,sqlite
          - floor: "1.94"
            label: rolify-seaorm
            args: -p rolify-seaorm --features postgres,mysql
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libmysqlclient-dev libsqlite3-dev
      # The dtolnay action ref pins the ACTION version; the toolchain input
      # selects the floor this leg checks (expressions are not allowed in
      # the uses position itself).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.floor }}
      - name: cargo +${{ matrix.floor }} check (${{ matrix.label }})
        run: cargo +${{ matrix.floor }} check ${{ matrix.args }}

  semver:
    name: Semver deny (cargo-semver-checks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned tool install (T-7-SC): exact known name plus version from
      # crates.io; any replacement needs the Package Legitimacy Gate first.
      - name: Install cargo-semver-checks 0.50.0
        run: cargo install cargo-semver-checks --version 0.50.0 --locked
      # Deny mode (D-20): no continue-on-error anywhere, so any reported
      # breaking change fails the build. The baseline resolves on crates.io
      # once 0.1.0 publishes; the sealed-SPI rules in
      # crates/rolify-core/src/store.rs keep trait growth minor-safe under
      # the seal. Pre-publish the baseline is missing, so these legs report
      # the missing baseline until the first release lands.
      - name: semver check (rolify-core)
        run: cargo semver-checks check-release -p rolify-core
      - name: semver check (rolify-test)
        run: cargo semver-checks check-release -p rolify-test
      - name: semver check (rolify-cli)
        run: cargo semver-checks check-release -p rolify-cli
      - name: semver check (rolify-diesel)
        run: cargo semver-checks check-release -p rolify-diesel
      - name: semver check (rolify-sqlx)
        run: cargo semver-checks check-release -p rolify-sqlx
      - name: semver check (rolify-seaorm)
        run: cargo semver-checks check-release -p rolify-seaorm
      - name: semver check (rolify-mongodb)
        run: cargo semver-checks check-release -p rolify-mongodb

  docsrs:
    name: Docs.rs replication (all-features, docsrs cfg)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Replicates docs.rs per the [package.metadata.docs.rs] blocks
      # (all-features plus --cfg docsrs, SC-2); metadata drift fails the
      # build here instead of on docs.rs (T-7-12). No -D warnings: a few
      # pre-existing intra-doc link warnings fail deny until the
      # doc-warning cleanup lands (docs.rs itself renders with warnings).
      - name: cargo doc docsrs (rolify-core)
        run: RUSTDOCFLAGS="--cfg docsrs" cargo doc -p rolify-core --all-features --no-deps
      - name: cargo doc docsrs (rolify-test)
        run: RUSTDOCFLAGS="--cfg docsrs" cargo doc -p rolify-test --all-features --no-deps
      - name: cargo doc docsrs (rolify-cli)
        run: RUSTDOCFLAGS="--cfg docsrs" cargo doc -p rolify-cli --all-features --no-deps
      # rolify-diesel builds its default (sync) surface, never --all-features:
      # all-features enables sync plus async together, which the intentional
      # compile_error! mode guard rejects (see the adapters job guard step).
      - name: cargo doc docsrs (rolify-diesel sync default)
        run: RUSTDOCFLAGS="--cfg docsrs" cargo doc -p rolify-diesel --no-deps
      - name: cargo doc docsrs (rolify-sqlx)
        run: RUSTDOCFLAGS="--cfg docsrs" cargo doc -p rolify-sqlx --all-features --no-deps
      - name: cargo doc docsrs (rolify-seaorm)
        run: RUSTDOCFLAGS="--cfg docsrs" cargo doc -p rolify-seaorm --all-features --no-deps
      - name: cargo doc docsrs (rolify-mongodb)
        run: RUSTDOCFLAGS="--cfg docsrs" cargo doc -p rolify-mongodb --all-features --no-deps

  feature-matrix:
    name: Feature matrix (rolify-test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Every rolify-test feature surface in both modes (SC-3): default,
      # suite, faker, and all-features async, plus is_sync, suite plus
      # is_sync, and all-features plus is_sync. all-features already
      # unifies is_sync on, so its legs cover both modes at once.
      - name: cargo test (rolify-test default)
        run: cargo test -p rolify-test
      - name: cargo test (rolify-test suite)
        run: cargo test -p rolify-test --features suite
      - name: cargo test (rolify-test faker)
        run: cargo test -p rolify-test --features faker
      - name: cargo test (rolify-test all-features)
        run: cargo test -p rolify-test --all-features
      - name: cargo test (rolify-test is_sync)
        run: cargo test -p rolify-test --features is_sync
      - name: cargo test (rolify-test suite,is_sync)
        run: cargo test -p rolify-test --features "suite is_sync"
      - name: cargo test (rolify-test all-features,is_sync)
        run: cargo test -p rolify-test --all-features --features is_sync
      # Per-feature doc builds: every documented surface must render.
      - name: cargo doc (rolify-test default)
        run: cargo doc -p rolify-test --no-deps
      - name: cargo doc (rolify-test suite)
        run: cargo doc -p rolify-test --no-deps --features suite
      - name: cargo doc (rolify-test faker)
        run: cargo doc -p rolify-test --no-deps --features faker
      - name: cargo doc (rolify-test all-features)
        run: cargo doc -p rolify-test --no-deps --all-features

  package:
    name: Package plus publish dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # File-inclusion proof (T-7-14): the exact file set that would ship;
      # a missing template or migration fails here. (cargo package has no
      # --dry-run flag; --list is the non-mutating equivalent.)
      - name: cargo package list (rolify-core)
        run: cargo package -p rolify-core --list
      - name: cargo package list (rolify-test)
        run: cargo package -p rolify-test --list
      - name: cargo package list (rolify-cli)
        run: cargo package -p rolify-cli --list
      - name: cargo package list (rolify-diesel)
        run: cargo package -p rolify-diesel --list
      - name: cargo package list (rolify-sqlx)
        run: cargo package -p rolify-sqlx --list
      - name: cargo package list (rolify-seaorm)
        run: cargo package -p rolify-seaorm --list
      - name: cargo package list (rolify-mongodb)
        run: cargo package -p rolify-mongodb --list
      # Publish-metadata proof (D-23, deny, no continue-on-error): per-crate
      # publish dry-run. Six legs are RED at HEAD by design, not by accident:
      # workspace path deps carry no version requirement yet (publishing
      # needs version plus path), so only rolify-core passes until the
      # publish sweep qualifies the versions. The red is the gate working.
      - name: cargo publish dry-run (rolify-core)
        run: cargo publish -p rolify-core --dry-run
      - name: cargo publish dry-run (rolify-test)
        run: cargo publish -p rolify-test --dry-run
      - name: cargo publish dry-run (rolify-cli)
        run: cargo publish -p rolify-cli --dry-run
      - name: cargo publish dry-run (rolify-diesel)
        run: cargo publish -p rolify-diesel --dry-run
      - name: cargo publish dry-run (rolify-sqlx)
        run: cargo publish -p rolify-sqlx --dry-run
      - name: cargo publish dry-run (rolify-seaorm)
        run: cargo publish -p rolify-seaorm --dry-run
      - name: cargo publish dry-run (rolify-mongodb)
        run: cargo publish -p rolify-mongodb --dry-run
