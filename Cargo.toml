[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.21"
maybe-async = "0.2.11"
rstest = "0.27"
pretty_assertions = "1.4"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
rolify-core = { path = "crates/rolify-core" }
rolify-test = { path = "crates/rolify-test" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
