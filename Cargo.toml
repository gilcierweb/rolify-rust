[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["GilcierWeb", "GilcierWeb <gilcierweb@gmail.com>"]
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.21"
maybe-async = "0.2.11"
rstest = "0.27"
pretty_assertions = "1.4"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
diesel = { version = "=2.3.13", default-features = false }
diesel_migrations = { version = "=2.3.2" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "migrate", "macros"] }
diesel-async = { version = "=0.9.2", default-features = false }
bb8 = "=0.9.1"
deadpool = "=0.13.1"
clap = { version = "4.6.7", features = ["derive"] }
uuid = "1"
rolify-core = { path = "crates/rolify-core" }
rolify-diesel = { path = "crates/rolify-diesel" }
rolify-test = { path = "crates/rolify-test" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
