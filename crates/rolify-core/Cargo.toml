[package]
name = "rolify-core"
version.workspace = true
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
thiserror.workspace = true
maybe-async.workspace = true
serde = { version = "1.0", optional = true, features = ["derive"] }
uuid = { workspace = true }

[features]
default = []
is_sync = ["maybe-async/is_sync", "rolify-test/is_sync"]
serde = ["dep:serde"]

[dev-dependencies]
rstest.workspace = true
pretty_assertions.workspace = true
faker-rust = "0.1"
tokio.workspace = true
serde_json = "1"
rolify-test = { path = "../rolify-test" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
