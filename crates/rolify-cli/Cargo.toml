[package]
name = "rolify-cli"
version.workspace = true
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
clap = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
anyhow = "1.0.104"
rolify-core = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
testcontainers = "=0.27.3"
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["postgres", "mysql", "blocking"] }
rolify-diesel = { workspace = true, features = ["postgres"] }
diesel = { workspace = true, features = ["postgres"] }
tokio = { workspace = true }
tempfile = "3.17"
walkdir = "2.5"
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "mysql", "sqlite", "migrate"] }
# Engine + runtime features mirror rolify-seaorm's proven sea-orm spellings
# (the 2.0 line forwards the same feature names): dev-only, so the live
# dialect legs can connect MySQL and SQLite through sea-orm. The runtime
# dependency tree of the crate stays exactly clap/thiserror/anyhow/rolify-core.
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-mysql", "sqlx-sqlite", "runtime-tokio", "runtime-tokio-rustls"] }

[features]
default = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]